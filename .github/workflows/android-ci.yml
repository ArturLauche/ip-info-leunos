name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android-ci.yml
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, test, lint, and inspect APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install Android SDK packages and accept licenses
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          [[ "$license_status" -eq 0 ]]
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' \
            'build-tools;36.0.0'

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        working-directory: android
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Test release scripts and inspect the built APK
        run: |
          set -euo pipefail
          node --test android/scripts/*.test.mjs android/scripts/lib/*.test.mjs
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT2" dump badging "$APK" > "$RUNNER_TEMP/debug-apk-badging.txt"
          VERSION_NAME="$(sed -n 's/^versionName=//p' android/version.properties)"
          EXPECTED_CODE="$(node --input-type=module -e "import { versionCode } from './android/scripts/lib/contract.mjs'; process.stdout.write(String(versionCode(process.argv[1])));" "$VERSION_NAME")"
          grep -Fq "package: name='com.leunos.ipinfo.debug' versionCode='$EXPECTED_CODE' versionName='$VERSION_NAME-debug'" "$RUNNER_TEMP/debug-apk-badging.txt"
          grep -Fq "minSdkVersion:'29'" "$RUNNER_TEMP/debug-apk-badging.txt"
          grep -Fq "targetSdkVersion:'37'" "$RUNNER_TEMP/debug-apk-badging.txt"
          "$APKSIGNER" verify --verbose "$APK" > "$RUNNER_TEMP/debug-apk-signature.txt"
          grep -Eq '^Verified using v2 scheme.*: true$|^Verified using v3 scheme.*: true$' "$RUNNER_TEMP/debug-apk-signature.txt"
          grep -Fq 'Number of signers: 1' "$RUNNER_TEMP/debug-apk-signature.txt"

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ip-info-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/**
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 7

  release-dry-run:
    name: Signed release and update-contract dry run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install Android SDK packages and accept licenses
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          [[ "$license_status" -eq 0 ]]
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' \
            'build-tools;36.0.0'

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Dry run only: generates an ephemeral test key and never reads production release secrets.
      - name: Create ephemeral dry-run signing identity
        id: dry-run-key
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/ip-info-dry-run.p12"
          CERTIFICATE="$RUNNER_TEMP/ip-info-dry-run.der"
          PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSWORD"
          export IPINFO_DRY_RUN_PASSWORD="$PASSWORD"
          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass:env IPINFO_DRY_RUN_PASSWORD \
            -keypass:env IPINFO_DRY_RUN_PASSWORD \
            -alias ip-info-dry-run \
            -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 30 \
            -dname 'CN=IP Info CI Dry Run, O=Leunos' \
            >/dev/null 2>&1
          chmod 600 "$KEYSTORE"
          keytool -exportcert -storetype PKCS12 -keystore "$KEYSTORE" \
            -storepass:env IPINFO_DRY_RUN_PASSWORD -alias ip-info-dry-run \
            -file "$CERTIFICATE" >/dev/null 2>&1
          FINGERPRINT="$(openssl dgst -sha256 "$CERTIFICATE" | awk '{ print tolower($NF) }')"
          [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          printf 'IPINFO_DRY_RUN_PASSWORD=%s\n' "$PASSWORD" >> "$GITHUB_ENV"
          printf 'IPINFO_DRY_RUN_CERT_SHA256=%s\n' "$FINGERPRINT" >> "$GITHUB_ENV"
          echo "Dry-run signing certificate SHA-256: $FINGERPRINT"

      - name: Build signed release APK with ephemeral key
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ip-info-dry-run.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ env.IPINFO_DRY_RUN_PASSWORD }}
          ANDROID_KEY_ALIAS: ip-info-dry-run
          ANDROID_KEY_PASSWORD: ${{ env.IPINFO_DRY_RUN_PASSWORD }}
          DRY_RUN_CERT_SHA256: ${{ env.IPINFO_DRY_RUN_CERT_SHA256 }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace "-Pipinfo.pinnedCertificates=$DRY_RUN_CERT_SHA256"

      - name: Verify release APK and generate facts
        env:
          DRY_RUN_CERT_SHA256: ${{ env.IPINFO_DRY_RUN_CERT_SHA256 }}
        run: |
          set -euo pipefail
          node android/scripts/verify-apk.mjs \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --version "$(sed -n 's/^versionName=//p' android/version.properties)" \
            --expected-cert-sha256 "$DRY_RUN_CERT_SHA256" \
            --build-tools-dir "$ANDROID_HOME/build-tools/36.0.0" \
            --json-out "$RUNNER_TEMP/ip-info-dry-run-facts.json"

      - name: Generate deterministic release-contract metadata
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ip-info-dry-run-assets"
          chmod 700 "$RUNNER_TEMP/ip-info-dry-run-assets"
          node android/scripts/generate-update-metadata.mjs \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --facts "$RUNNER_TEMP/ip-info-dry-run-facts.json" \
            --tag "android-v$(sed -n 's/^versionName=//p' android/version.properties)" \
            --out-dir "$RUNNER_TEMP/ip-info-dry-run-assets"

      - name: Run updater metadata end-to-end contract test
        working-directory: android
        env:
          METADATA: ${{ runner.temp }}/ip-info-dry-run-assets/android-update.json
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            -Pipinfo.contract.metadata="$METADATA" \
            --tests 'com.leunos.ipinfo.updates.ReleaseContractEndToEndTest' \
            --stacktrace

      - name: Confirm wrong signing fingerprints are rejected
        env:
          DRY_RUN_CERT_SHA256: ${{ env.IPINFO_DRY_RUN_CERT_SHA256 }}
        run: |
          set -euo pipefail
          WRONG_CERT="$(printf '%064d' 0)"
          [[ "$WRONG_CERT" != "$DRY_RUN_CERT_SHA256" ]] || WRONG_CERT="$(printf '%064d' 1)"
          if node android/scripts/verify-apk.mjs \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --version "$(sed -n 's/^versionName=//p' android/version.properties)" \
            --expected-cert-sha256 "$WRONG_CERT" \
            --build-tools-dir "$ANDROID_HOME/build-tools/36.0.0" \
            > "$RUNNER_TEMP/wrong-certificate.log" 2>&1; then
            echo 'Verifier unexpectedly accepted an incorrect signer fingerprint.' >&2
            exit 1
          fi
          grep -q 'not in the expected signing identity' "$RUNNER_TEMP/wrong-certificate.log"

      - name: Remove ephemeral signing material
        if: always()
        env:
          KEYSTORE: ${{ runner.temp }}/ip-info-dry-run.p12
          CERTIFICATE: ${{ runner.temp }}/ip-info-dry-run.der
        run: |
          set -euo pipefail
          for file in "$KEYSTORE" "$CERTIFICATE"; do
            if [[ -f "$file" ]]; then
              if command -v shred >/dev/null; then shred -u "$file" || rm -f "$file"; else rm -f "$file"; fi
            fi
          done

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Oldest supported API and the newest image the emulator runner boots reliably. The API 37.0 image
      # restarts its runtime during first boot, which races the runner's unlock step ("Can't find service: input").
      matrix:
        include:
          - api-level: '29'
            system-image-api-level: '29'
            ram-size: 2048M
            cores: 2
            emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          - api-level: '36'
            system-image-api-level: '36'
            ram-size: 3072M
            cores: 2
            emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install compile SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          [[ "$license_status" -eq 0 ]]
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' \
            'build-tools;36.0.0'

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run instrumentation and same-signature upgrade tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          system-image-api-level: ${{ matrix.system-image-api-level }}
          target: google_apis
          arch: x86_64
          ram-size: ${{ matrix.ram-size }}
          cores: ${{ matrix.cores }}
          emulator-options: ${{ matrix.emulator-options }}
          disable-animations: true
          emulator-boot-timeout: 600
          working-directory: android
          # The action runs each line separately under sh (dash), so keep these lines free of bash-only options.
          script: |
            ./scripts/capture-screenshots.sh
            ./gradlew connectedDebugAndroidTest --stacktrace
            ./scripts/emulator-upgrade-test.sh

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-ui-screenshots-api-${{ matrix.api-level }}
          path: android/app/build/ui-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumentation-reports-api-${{ matrix.api-level }}
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7
