name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Assert no client source maps remain
        run: |
          maps=$(find .next/static -name '*.map' -print)
          if [ -n "$maps" ]; then
            echo "Client source maps remain under .next/static after pnpm build:"
            printf '%s\n' "$maps"
            exit 1
          fi
